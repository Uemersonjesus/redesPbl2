name: sensor-sul-boia-1
version: "3.9"
networks:
  raft-shared:
    name: raft-shared
    driver: bridge
    external: true
services:
  sensor:
    build:
      context: .
      dockerfile: sensor/Dockerfile
    container_name: sul-boia-1
    hostname: sul-boia-1
    environment:
      SENSOR_ID: sul-boia-1
      SETOR_ID:  setor-sul
      TIPO:      boia_impacto
      LAT:       26.47
      LONG:      56.39
      SENSOR_DEMO_MODE: "${SENSOR_DEMO_MODE:-true}"
      BROKER_WS_ADDRS: "broker1:8090,broker2:8090,broker3:8090"
    networks: [raft-shared]
    restart: unless-stopped
