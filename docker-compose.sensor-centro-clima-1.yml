name: sensor-centro-clima-1
version: "3.9"
networks:
  raft-shared:
    name: raft-shared
    driver: bridge
    external: true
services:
  sensor:
    build:
      context: .
      dockerfile: sensor/Dockerfile
    container_name: centro-clima-1
    hostname: centro-clima-1
    environment:
      SENSOR_ID: centro-clima-1
      SETOR_ID:  setor-centro
      TIPO:      clima
      LAT:       26.55
      LONG:      56.29
      SENSOR_DEMO_MODE: "${SENSOR_DEMO_MODE:-true}"
      BROKER_WS_ADDRS: "broker1:8090,broker2:8090,broker3:8090"
    networks: [raft-shared]
    restart: unless-stopped
